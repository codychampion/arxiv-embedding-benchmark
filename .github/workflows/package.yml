name: package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Inspect built wheel metadata
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'Expected one wheel, found {len(wheels)}')

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata = [name for name in names if name.endswith('METADATA')]
              scripts = [name for name in names if name.endswith('entry_points.txt')]
              package_files = [name for name in names if name.startswith('embedding_benchmarking/')]

              if not metadata:
                  raise SystemExit('Missing package METADATA')
              if not scripts:
                  raise SystemExit('Missing entry_points.txt')
              if not package_files:
                  raise SystemExit('Missing embedding_benchmarking package files')

              entry_points = archive.read(scripts[0]).decode('utf-8')
              if 'arxiv-embedding-benchmark = embedding_benchmarking.cli:cli' not in entry_points:
                  raise SystemExit('CLI entry point is missing or incorrect')

          print(f'Validated wheel contents: {wheel.name}')
          PY
